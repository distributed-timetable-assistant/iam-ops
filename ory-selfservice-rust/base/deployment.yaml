apiVersion: apps/v1
kind: Deployment
metadata:
  name: ory-selfservice-rust
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: ory-selfservice-rust
  template:
    metadata:
      labels:
        app: ory-selfservice-rust
    spec:
      containers:
        - name: ory-selfservice-rust
          image: backendd/dita.ory-selfservice-rust:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP__LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: APP__PUBLIC_BASE_URL
              value: "https://identity.outi.ir"
            - name: APP__KRATOS_PUBLIC_URL
              value: "http://kratos:4433"
            - name: APP__HYDRA_ADMIN_URL
              value: "http://hydra:4445"
            - name: RUST_LOG
              value: "info"
            # Immediately return unused memory pages to the OS.
            - name: MIMALLOC_PURGE_DELAY
              value: "0"
            # Disable Transparent Huge Pages to minimize memory footprint.
            - name: MIMALLOC_ALLOW_THP
              value: "0"
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 0m
              memory: 0Mi
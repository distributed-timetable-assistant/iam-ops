version: v0.13.0

serve:
  public:
    base_url: https://web.login.outi.ir/
    cors:
      enabled: true
      allow_credentials: true
      allowed_origins:
        - https://web.login.outi.ir
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Content-type
        - Authorization
  admin:
    base_url: http://kratos:4434/

session:
  cookie:
    domain: .outi.ir

oauth2_provider:
  url: http://hydra-admin:4445

selfservice:
  default_browser_return_url: https://web.login.outi.ir/
  allowed_return_urls:
    - https://web.login.outi.ir
    - https://web.login.outi.ir/
    - https://web.login.outi.ir/oauth2/login
    - https://web.login.outi.ir/oauth2/login/
    - https://web.login.outi.ir/oauth2/consent
    - https://web.login.outi.ir/oauth2/consent/
    - https://web.login.outi.ir/logout
    - https://login.outi.ir
    - https://login.outi.ir/

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
    totp:
      config:
        issuer: Kratos
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: https://web.login.outi.ir/error

    settings:
      ui_url: https://web.login.outi.ir/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: https://web.login.outi.ir/recovery
      use: code

    verification:
      enabled: true
      ui_url: https://web.login.outi.ir/verification
      use: code
      after:
        default_browser_return_url: https://web.login.outi.ir/

    logout:
      after:
        default_browser_return_url: https://web.login.outi.ir/login

    login:
      ui_url: https://web.login.outi.ir/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: https://web.login.outi.ir/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true

feature_flags:
  use_continue_with_transitions: true
